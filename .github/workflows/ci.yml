name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "docs/PROJECT_MEMORY.md"
      - "docs/agent-harness.md"
      - "docs/decisions/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "docs/PROJECT_MEMORY.md"
      - "docs/agent-harness.md"
      - "docs/decisions/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Test build and release scripts
        run: ./scripts/test_release_scripts.sh
      - name: Compile with complete strict concurrency diagnostics
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency -Xswiftc -warnings-as-errors
      - name: Verify tests and app bundle
        run: ./scripts/verify.sh
