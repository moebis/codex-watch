contracts:
  - id: MENU-BAR-001
    title: The quota is presented only in the macOS menu bar
    status: superseded
    statement: The app displays a system icon and the rounded remaining weekly percentage in one variable-length NSStatusItem. The icon hugs the title so both are centered as one compact unit, while the status item retains native macOS outer spacing and click behavior. It creates no notch overlay, floating panel, Dock icon, or ordinary app window.
    rationale: Native compact image-title layout matches surrounding menu bar items without fragile negative spacing or a reduced click target, and avoids screen geometry, pointer interception, and overlay privacy risks.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [menu-bar, status-menu]
      exclude: [notch-overlay, session-state]
    examples:
      positive: The menu bar shows an icon directly adjacent to 68% as one centered unit and opens a small quota menu.
      negative: The icon is pinned to one edge with excessive space before the number, or a transparent panel is positioned around the physical camera notch.
    guards:
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: inspect icon and percentage spacing on a real Mac"
    supersedes: []
    superseded_by: DASHBOARD-SURFACE-011
    last_verified_commit: pending

  - id: QUOTA-SEMANTICS-002
    title: The displayed number is the remaining weekly percentage
    status: active
    statement: The menu bar prefers a window classified as weekly and displays 100 minus its clamped used percentage, rounded to the nearest integer. Missing data is shown as an em dash and is never fabricated from another window.
    rationale: Users need one stable number whose meaning does not change when the endpoint returns multiple windows.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [usage-parsing, menu-bar]
      exclude: [cost-estimation, reset-credit-redemption]
    examples:
      positive: A weekly used value of 31.6 produces 68% in the menu bar.
      negative: A five-hour rolling window is presented as weekly quota.
    guards:
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - Tests/CodexWatchTests/UsageWindowClassifierTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
    supersedes: []
    superseded_by: null
    last_verified_commit: 23b1418

  - id: PRIVACY-BOUNDARY-003
    title: Credentials and private Codex data remain minimally exposed
    status: active
    statement: The app reads only the bounded local auth file, keeps credentials and authenticated responses in process memory, sends credentials only over HTTPS to the original ChatGPT usage host, and limits each response to one mebibyte before decoding. It never contacts an update service, scans sessions, reads prompts, logs sensitive data, caches responses, or stores cookies. Analytics leaves process memory only when the user explicitly chooses a CSV destination, and only the selected validated projection is written.
    rationale: The app handles an access token and must minimize both data access and exfiltration paths.
    source: security-review
    owner: project-maintainer
    risk: critical
    scope:
      include: [auth-reader, usage-client, network-session]
      exclude: [conversation-monitoring, telemetry, automatic-download, automatic-install]
    examples:
      positive: Ephemeral bounded GET requests obtain usage, reset-credit, and 365-day analytics details; a CSV is written only after the user confirms a save destination.
      negative: A rollout JSONL file is parsed, an authenticated redirect is followed to another host, or analytics is cached automatically on disk.
    guards:
      - Tests/CodexWatchTests/CodexAuthReaderTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/UsageAnalyticsCSVExporterTests.swift
      - "manual: sensitive string and executable dependency review"
    supersedes: []
    superseded_by: null
    last_verified_commit: 23b1418

  - id: PACKAGE-RELEASE-004
    title: Version tags produce verified GitHub release artifacts
    status: active
    statement: A vMAJOR.MINOR.PATCH tag matching Info.plist triggers CI to test, build, verify, archive, checksum, and publish the app. The release workflow must use pinned actions and must not upload credentials or local Codex data.
    rationale: Tag-driven builds reduce the risk of a manually substituted binary and make the source-to-release path reviewable.
    source: security-review
    owner: project-maintainer
    risk: high
    scope:
      include: [ci, packaging, github-release]
      exclude: [apple-notarization-without-credentials]
    examples:
      positive: Pushing v0.2.0 creates a universal ZIP and SHA-256 file after verification passes.
      negative: A release asset is uploaded manually from an unverified local build.
    guards:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - scripts/release.sh
      - scripts/verify_app.sh
    supersedes: []
    superseded_by: null
    last_verified_commit: 23b1418

  - id: MENU-PROGRESS-005
    title: The status menu visualizes quota and exact time windows
    status: active
    statement: The top of the status menu contains two always-present labeled native progress bars for weekly quota and weekly reset, plus a reset-credit expiry bar when exact grant and expiry metadata is available. The quota bar is the clamped remaining weekly percentage. Each time bar is the clamped time remaining divided by its exact server-provided duration. Text labels preserve the numeric meaning, and missing metadata never produces an assumed progress value.
    rationale: Remaining-state bars make quota capacity and renewal or expiry timing scannable while keeping each calculation truthful and accessible.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [status-menu, usage-parsing, accessibility]
      exclude: [quota-prediction, hardcoded-reset-window, additional-network-data]
    examples:
      positive: With 81 percent quota remaining, two days left in a seven-day weekly window, and 20 days left in a 30-day reset-credit lifetime, the bars show 81 percent, two sevenths, and two thirds remaining.
      negative: A time bar assumes a weekly or reset-credit duration when the endpoint omits the required metadata.
    guards:
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - "manual: inspect all available progress bars and labels in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending

  - id: RESET-CREDITS-006
    title: Available rate-limit reset credits are shown without fabrication
    status: active
    statement: When the usage response includes a nonnegative rate_limit_reset_credits.available_count value, the status menu displays that count in a separate labeled row. The app also makes a best-effort read-only request to the same ChatGPT HTTPS host for reset-credit details and shows the earliest expiry among available credits supported by the current plan. When that same credit has exact granted_at and expires_at values, a native progress bar shows its clamped remaining lifetime. Zero is displayed as an available count, while a missing or invalid count hides the row. Missing detail metadata or a detail-request failure preserves the count without fabricating an expiry or duration. The app does not infer a total credit capacity or merge this count with the weekly automatic reset time.
    rationale: Reset credits are useful actionable quota information, including when the next one will expire, but their meaning must remain distinct from the weekly window and absent values must not be misrepresented.
    source: user-confirmed
    owner: project-maintainer
    risk: high
    scope:
      include: [usage-parsing, status-menu, reset-credits]
      exclude: [credit-redemption, inferred-credit-capacity, non-ChatGPT-network-requests]
    examples:
      positive: Two available credits display as 2 available with the earliest supported available expiry in local time and its exact remaining-lifetime progress, while a failed detail request still displays the count.
      negative: A missing grant time is treated as a fixed 30-day duration, or an expired or unsupported credit supplies the displayed expiry.
    guards:
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: inspect the reset-credit row in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending

  - id: PLAN-DISPLAY-008
    title: The status menu shows only a server-reported recognized ChatGPT plan
    status: active
    statement: The expanded status menu contains an always-present Plan row. A recognized plan_type from the existing usage response is shown as a normalized ChatGPT plan name. Missing or unrecognized values display Unavailable; the app never guesses a plan, Pro sub-tier, token allowance, or absolute quota from percentages.
    rationale: The server-reported plan gives useful account context, while fail-closed normalization prevents an internal or changed field from becoming a misleading entitlement claim.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [usage-parsing, status-menu]
      exclude: [hover-popover, token-estimation, plan-sub-tier-inference, additional-network-data]
    examples:
      positive: A plan_type of pro displays Plan and Pro, while prolite displays Plan and Pro Lite, above the weekly quota row.
      negative: An unknown plan is displayed verbatim, or 68 percent remaining is converted into a fabricated token count.
    guards:
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: inspect the Plan row in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending

  - id: CREDITS-BALANCE-009
    title: The status menu shows the server-reported ChatGPT credits remaining
    status: active
    statement: When credits.has_credits is true and the existing usage response contains a numeric credits.balance value, the expanded status menu displays it in one Credits remaining row. Positive, zero, and negative server-reported balances are preserved. When credits.unlimited is true, the row displays Unlimited instead of a numeric balance. A missing entitlement, missing or malformed balance, or oversized value hides the row and is never replaced with an assumed zero. No message estimates or other credits metadata are displayed.
    rationale: The server can report a negative balance after concurrent usage depletes credits, while has_credits and unlimited determine whether a numeric balance has the intended meaning.
    source: user-confirmed-and-official-docs
    owner: project-maintainer
    risk: medium
    scope:
      include: [usage-parsing, status-menu, credits-balance]
      exclude: [message-estimates, overage-state, spend-controls, additional-rate-limits]
    examples:
      positive: A credits.balance of -1.25 with has_credits true displays Credits remaining and -1.25, while unlimited true displays Unlimited.
      negative: A missing entitlement displays zero, or approximate message counts are added to the menu.
    guards:
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: compare the Credits remaining row with the ChatGPT Usage Dashboard on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending

  - id: USAGE-ANALYTICS-010
    title: The menu shows only bounded server-reported aggregate usage
    status: superseded
    statement: Codex Watch may request the inclusive trailing 30 calendar days of daily aggregate usage from the authenticated ChatGPT HTTPS host and display the summed total, uncached-input, cached-input, and output tokens plus turns and threads. The app accepts only day-grouped rows with valid unique dates inside the requested interval and complete nonnegative non-overflowing totals, keeps the result only in process memory, refreshes it at launch and on manual refresh but no more than once every 15 minutes automatically, and preserves weekly quota plus any prior in-memory aggregate when the analytics request fails. It never scans local sessions, reads prompts, scrapes HTML, or fabricates lifetime totals, streaks, or profile statistics.
    rationale: Server aggregates provide useful absolute usage detail without exposing conversation content, while bounded decoding and best-effort refresh preserve the app's narrow privacy and reliability boundary.
    source: user-confirmed-and-observed-official-product
    owner: project-maintainer
    risk: high
    scope:
      include: [usage-analytics, usage-parsing, status-menu, network-session]
      exclude: [session-scanning, prompt-reading, telemetry, html-scraping, lifetime-inference]
    examples:
      positive: Two complete daily rows are summed into truthful 30-day token, turn, and chat totals and a later analytics failure leaves the weekly quota working.
      negative: A missing input-token field is treated as zero, a negative total is displayed, or rollout files are parsed to reconstruct lifetime usage.
    guards:
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: compare the 30-day rows with the official Codex Usage Analytics page"
    supersedes: []
    superseded_by: USAGE-ANALYTICS-012
    last_verified_commit: pending

  - id: DASHBOARD-SURFACE-011
    title: The menu bar remains persistent with one on-demand native analytics window
    status: active
    statement: Codex Watch remains an LSUIElement app whose persistent control surface is one native NSStatusItem showing the rounded base-weekly percentage. The status menu may open one reusable 940 by 720 resizable native analytics window with 7, 30, 90, and 365 day ranges, but the app creates no notch overlay, hidden web view, persistent Dock icon, or duplicate analytics window.
    rationale: A native on-demand window provides enough space for truthful charts, coverage, and model/client tables without returning to screen overlays or embedding browser state.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [menu-bar, status-menu, analytics-window, accessibility]
      exclude: [notch-overlay, webview, persistent-dock-icon, session-state]
    examples:
      positive: Open Analytics Dashboard reuses the existing native window and the menu bar continues to show the unchanged weekly percentage.
      negative: Selecting the action creates another window each time, adds a persistent Dock icon, or replaces the weekly percentage with a model-specific limit.
    guards:
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - Tests/CodexWatchTests/AnalyticsDashboardModelTests.swift
      - "manual: reopen and resize the analytics window while inspecting the menu bar on a real Mac"
    supersedes: [MENU-BAR-001]
    superseded_by: null
    last_verified_commit: pending

  - id: USAGE-ANALYTICS-012
    title: One bounded server dataset powers truthful Codex analytics projections
    status: active
    statement: Codex Watch requests at most the inclusive trailing 365 calendar days of day-grouped aggregate usage from the authenticated ChatGPT HTTPS host, validates it into an in-memory dataset, and derives 7, 30, 90, and 365 day projections without additional range requests. Token totals aggregate only rows with complete nonnegative token fields. Rows that contain valid turns and threads but omit every token field remain explicitly activity-only, distinct from observed zero-token and missing dates. Model rows report activity and credits, client rows report tokens, comparisons require at least 90 percent token coverage in both periods, and 365 day comparison is unavailable. A user-requested CSV exports only the selected validated projection.
    rationale: The wider bounded response supplies useful Codex metrics while explicit coverage and activity-only states prevent historical schema differences from becoming fabricated token usage.
    source: user-confirmed-and-live-verified
    owner: project-maintainer
    risk: high
    scope:
      include: [usage-analytics, projection, dashboard, status-menu, csv-export]
      exclude: [session-scanning, lifetime-inference, model-token-inference, pricing, html-scraping]
    examples:
      positive: A day with turns and threads but no token keys contributes to activity totals, exports as Activity only with blank token cells, and does not count toward token coverage.
      negative: Missing token fields are converted to zero, model credits are labeled as tokens, or a 30 day total is fetched with a separate authenticated request.
    guards:
      - Tests/CodexWatchTests/UsageAnalyticsDatasetTests.swift
      - Tests/CodexWatchTests/UsageAnalyticsProjectionTests.swift
      - Tests/CodexWatchTests/AnalyticsDashboardModelTests.swift
      - Tests/CodexWatchTests/UsageAnalyticsCSVExporterTests.swift
      - "manual: compare dashboard ranges and data-through labels with the official Codex analytics page"
    supersedes: [USAGE-ANALYTICS-010]
    superseded_by: null
    last_verified_commit: pending

  - id: REFRESH-COORDINATION-013
    title: Refresh work is coordinated, bounded, and user-selectable
    status: active
    statement: A single coordinator owns automatic, manual, menu-open, and wake refresh triggers. Repeated automatic triggers coalesce into active work; manual refresh replaces older work and only the newest generation may publish; scheduled delays start after completion; shutdown prevents publication. Fixed choices are Manual, 1, 2, 5, 15, and 30 minutes. Adaptive is the fresh-install default, ranges from 2 to 30 minutes based only on menu interaction, and uses 30 minutes during Low Power Mode or serious thermal pressure. Menu opening refreshes quota only when the last success is older than 60 seconds, and automatic analytics attempts remain at least 15 minutes apart.
    rationale: Generation ownership prevents cancellation churn and stale publication while explicit and adaptive choices control freshness without scanning processes, sessions, or user content.
    source: user-confirmed
    owner: project-maintainer
    risk: high
    scope:
      include: [refresh-coordinator, preferences, stale-state, wake-handling]
      exclude: [process-scanning, session-scanning, notifications, token-refresh]
    examples:
      positive: Two automatic triggers share one fetch, while a later manual trigger replaces it and is the only generation allowed to update the menu and dashboard.
      negative: A repeating timer cancels a request every minute, a stale generation publishes after manual refresh, or adaptive cadence inspects running Codex processes.
    guards:
      - Tests/CodexWatchTests/RefreshCoordinatorTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: exercise every refresh-frequency choice and wake behavior on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending

  - id: PROFILE-LIFETIME-014
    title: Exact Codex profile statistics are separate, bounded, and fail closed
    status: active
    statement: Codex Watch may perform a bounded read-only GET of /backend-api/wham/profiles/me on the existing authenticated ChatGPT HTTPS host and display independently validated server-reported lifetime tokens, peak daily tokens, longest running turn, streaks, daily token buckets, activity insights, and top Codex invocations in a separate Lifetime dashboard tab. The request shares the existing analytics cadence, ephemeral no-cookie session, same-host redirect rule, one-mebibyte response ceiling, and in-memory-only retention. Missing or invalid profile fields remain unavailable and are never inferred from the 365-day analytics dataset or local sessions. Profile failure preserves quota and bounded Usage analytics, may preserve the last valid in-memory profile as stale, and never blocks the menu bar. The compact menu hides only codex-spark and codex-spark-weekly presentation rows while retaining those decoded capabilities, and its colored non-template monitoring mark remains visible in light, dark, and selected states.
    rationale: The same-host profile route supplies the exact first-party account totals that bounded historical rows cannot reconstruct, while a distinct surface and independent failure preserve truthful semantics and the narrow privacy boundary.
    source: user-confirmed-and-live-verified
    owner: project-maintainer
    risk: high
    scope:
      include: [profile-statistics, lifetime-dashboard, status-menu, status-icon, network-session]
      exclude: [profile-editing, avatar-loading, session-scanning, lifetime-inference, html-scraping, lifetime-csv]
    examples:
      positive: A server lifetime_tokens value of 30300000000 displays as 30.3B while an absent peak_daily_tokens value displays Unavailable and the weekly menu bar continues to refresh.
      negative: The app adds bounded daily totals to a manual baseline, reads rollout logs, loads a remote avatar, or treats a failed profile request as a quota failure.
    guards:
      - Tests/CodexWatchTests/CodexProfileStatsTests.swift
      - Tests/CodexWatchTests/CodexUsageClientTests.swift
      - Tests/CodexWatchTests/LifetimeDashboardModelTests.swift
      - Tests/CodexWatchTests/MenuBarTextTests.swift
      - "manual: compare Lifetime values with the official Codex profile and inspect the status mark in light, dark, and selected states"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending
