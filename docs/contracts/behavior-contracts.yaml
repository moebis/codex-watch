contracts:
  - id: MENU-BAR-001
    title: The quota is presented only in the macOS menu bar
    status: active
    statement: The app displays a system icon and the rounded remaining weekly percentage in one variable-length NSStatusItem. The icon hugs the title so both are centered as one compact unit, while the status item retains native macOS outer spacing and click behavior. It creates no notch overlay, floating panel, Dock icon, or ordinary app window.
    rationale: Native compact image-title layout matches surrounding menu bar items without fragile negative spacing or a reduced click target, and avoids screen geometry, pointer interception, and overlay privacy risks.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [menu-bar, status-menu]
      exclude: [notch-overlay, session-state]
    examples:
      positive: The menu bar shows an icon directly adjacent to 68% as one centered unit and opens a small quota menu.
      negative: The icon is pinned to one edge with excessive space before the number, or a transparent panel is positioned around the physical camera notch.
    guards:
      - Tests/CodexNotchTests/MenuBarTextTests.swift
      - "manual: inspect icon and percentage spacing on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: 23b1418

  - id: QUOTA-SEMANTICS-002
    title: The displayed number is the remaining weekly percentage
    status: active
    statement: The menu bar prefers a window classified as weekly and displays 100 minus its clamped used percentage, rounded to the nearest integer. Missing data is shown as an em dash and is never fabricated from another window.
    rationale: Users need one stable number whose meaning does not change when the endpoint returns multiple windows.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [usage-parsing, menu-bar]
      exclude: [cost-estimation, reset-credit-redemption]
    examples:
      positive: A weekly used value of 31.6 produces 68% in the menu bar.
      negative: A five-hour rolling window is presented as weekly quota.
    guards:
      - Tests/CodexNotchTests/MenuBarTextTests.swift
      - Tests/CodexNotchTests/UsageWindowClassifierTests.swift
      - Tests/CodexNotchTests/CodexUsageClientTests.swift
    supersedes: []
    superseded_by: null
    last_verified_commit: 23b1418

  - id: PRIVACY-BOUNDARY-003
    title: Credentials and private Codex data remain minimally exposed
    status: active
    statement: The app reads only the bounded local auth file, keeps credentials in process memory, sends them only over HTTPS to the original ChatGPT usage host, and never attaches them to the separate unauthenticated GitHub release check. It never scans sessions, reads prompts, logs sensitive data, caches responses, or stores cookies.
    rationale: The app handles an access token and must minimize both data access and exfiltration paths.
    source: security-review
    owner: project-maintainer
    risk: critical
    scope:
      include: [auth-reader, usage-client, network-session]
      exclude: [conversation-monitoring, telemetry, automatic-download, automatic-install]
    examples:
      positive: One ephemeral GET request obtains usage and no response body is persisted.
      negative: A rollout JSONL file is parsed or an authenticated redirect is followed to another host.
    guards:
      - Tests/CodexNotchTests/CodexAuthReaderTests.swift
      - Tests/CodexNotchTests/CodexUsageClientTests.swift
      - "manual: sensitive string and executable dependency review"
    supersedes: []
    superseded_by: null
    last_verified_commit: 23b1418

  - id: PACKAGE-RELEASE-004
    title: Version tags produce verified GitHub release artifacts
    status: active
    statement: A vMAJOR.MINOR.PATCH tag matching Info.plist triggers CI to test, build, verify, archive, checksum, and publish the app. The release workflow must use pinned actions and must not upload credentials or local Codex data.
    rationale: Tag-driven builds reduce the risk of a manually substituted binary and make the source-to-release path reviewable.
    source: security-review
    owner: project-maintainer
    risk: high
    scope:
      include: [ci, packaging, github-release]
      exclude: [apple-notarization-without-credentials]
    examples:
      positive: Pushing v0.2.0 creates a universal ZIP and SHA-256 file after verification passes.
      negative: A release asset is uploaded manually from an unverified local build.
    guards:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - scripts/release.sh
      - scripts/verify_app.sh
    supersedes: []
    superseded_by: null
    last_verified_commit: 23b1418

  - id: MENU-PROGRESS-005
    title: The status menu visualizes quota and exact time windows
    status: active
    statement: The top of the status menu contains two always-present labeled native progress bars for weekly quota and weekly reset, plus a reset-credit expiry bar when exact grant and expiry metadata is available. The quota bar is the clamped remaining weekly percentage. Each time bar is the clamped time remaining divided by its exact server-provided duration. Text labels preserve the numeric meaning, and missing metadata never produces an assumed progress value.
    rationale: Remaining-state bars make quota capacity and renewal or expiry timing scannable while keeping each calculation truthful and accessible.
    source: user-confirmed
    owner: project-maintainer
    risk: medium
    scope:
      include: [status-menu, usage-parsing, accessibility]
      exclude: [quota-prediction, hardcoded-reset-window, additional-network-data]
    examples:
      positive: With 81 percent quota remaining, two days left in a seven-day weekly window, and 20 days left in a 30-day reset-credit lifetime, the bars show 81 percent, two sevenths, and two thirds remaining.
      negative: A time bar assumes a weekly or reset-credit duration when the endpoint omits the required metadata.
    guards:
      - Tests/CodexNotchTests/MenuBarTextTests.swift
      - Tests/CodexNotchTests/CodexUsageClientTests.swift
      - "manual: inspect all available progress bars and labels in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending

  - id: UPDATE-CHECK-007
    title: Update checks are manual, bounded, and informational
    status: active
    statement: The menu shows the installed app version and checks for updates only when the user requests it. The check uses an ephemeral uncached HTTPS request without credentials to the fixed GitHub API repository endpoint, accepts release links only for the same repository on github.com, and never downloads or installs an update automatically.
    rationale: Users can discover releases without adding a persistent updater, third-party dependency, credential exposure, or silent code replacement.
    source: user-confirmed
    owner: project-maintainer
    risk: high
    scope:
      include: [status-menu, version-display, github-release-check]
      exclude: [background-check, telemetry, automatic-download, automatic-install]
    examples:
      positive: Clicking Check for Updates reports that v0.6.0 is available and offers its GitHub release page.
      negative: The app checks in the background, sends an Authorization header to GitHub, or replaces itself.
    guards:
      - Tests/CodexNotchTests/UpdateServiceTests.swift
      - "manual: inspect version and update-check states in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending

  - id: RESET-CREDITS-006
    title: Available rate-limit reset credits are shown without fabrication
    status: active
    statement: When the usage response includes a nonnegative rate_limit_reset_credits.available_count value, the status menu displays that count in a separate labeled row. The app also makes a best-effort read-only request to the same ChatGPT HTTPS host for reset-credit details and shows the earliest expiry among available credits supported by the current plan. When that same credit has exact granted_at and expires_at values, a native progress bar shows its clamped remaining lifetime. Zero is displayed as an available count, while a missing or invalid count hides the row. Missing detail metadata or a detail-request failure preserves the count without fabricating an expiry or duration. The app does not infer a total credit capacity or merge this count with the weekly automatic reset time.
    rationale: Reset credits are useful actionable quota information, including when the next one will expire, but their meaning must remain distinct from the weekly window and absent values must not be misrepresented.
    source: user-confirmed
    owner: project-maintainer
    risk: high
    scope:
      include: [usage-parsing, status-menu, reset-credits]
      exclude: [credit-redemption, inferred-credit-capacity, non-ChatGPT-network-requests]
    examples:
      positive: Two available credits display as 2 available with the earliest supported available expiry in local time and its exact remaining-lifetime progress, while a failed detail request still displays the count.
      negative: A missing grant time is treated as a fixed 30-day duration, or an expired or unsupported credit supplies the displayed expiry.
    guards:
      - Tests/CodexNotchTests/CodexUsageClientTests.swift
      - Tests/CodexNotchTests/MenuBarTextTests.swift
      - "manual: inspect the reset-credit row in the open menu on a real Mac"
    supersedes: []
    superseded_by: null
    last_verified_commit: pending
